  gap: 0.55rem;
  margin: 1.2rem 0 0;
  padding: 0;
  list-style: none;
}

.control-item,
.lock-check-complete,
.lock-check-pending {
  position: relative;
  min-width: 0;
  padding-left: 1.55rem;
  color: var(--text-muted);
}

.control-item::before,
.lock-check-complete::before,
.lock-check-pending::before {
  content: "◇";
  position: absolute;
  left: 0;
  color: var(--primary-color);
  text-shadow: 0 0 0.8rem currentColor;
}

.briefing-actions {
  display: grid;
  align-content: center;
  justify-items: start;
  gap: 0.75rem;
}

.sg-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-width: 0;
  min-height: 2.85rem;
  max-width: 100%;
  padding: 0.72rem 1rem;
  color: var(--primary-color);
  background:
    linear-gradient(180deg, rgba(104, 255, 225, 0.13), rgba(104, 255, 225, 0.045)),
    rgba(3, 8, 13, 0.8);
  border: 1px solid rgba(104, 255, 225, 0.36);
  border-radius: var(--radius-sm);
  box-shadow: inset 0 0 1.2rem rgba(104, 255, 225, 0.055);
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  line-height: 1.25;
  text-align: center;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  transition:
    transform var(--motion-duration) ease,
    color var(--motion-duration) ease,
    background-color var(--motion-duration) ease,
    border-color var(--motion-duration) ease,
    box-shadow var(--motion-duration) ease,
    opacity var(--motion-duration) ease,
    filter var(--motion-duration) ease;
}

.sg-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
  opacity: 0;
  transform: translateX(-60%);
  transition: opacity var(--motion-duration) ease, transform 420ms ease;
}

.sg-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  color: #041411;
  background: var(--primary-color);
  border-color: rgba(232, 255, 249, 0.85);
  box-shadow: 0 0 1.4rem rgba(104, 255, 225, 0.28);
}

.sg-btn:hover:not(:disabled)::before {
  opacity: 1;
  transform: translateX(60%);
}

.sg-btn:active:not(:disabled) {
  transform: translateY(0);
}

.sg-btn:disabled {
  cursor: not-allowed;
  opacity: 0.52;
  filter: grayscale(0.45);
}

.primary-action,
.mission-start-button {
  color: #03100e;
  background:
    linear-gradient(180deg, #dffff8, var(--primary-color));
  border-color: rgba(232, 255, 249, 0.9);
  box-shadow:
    0 0 1.75rem rgba(104, 255, 225, 0.26),
    inset 0 1px 0 rgba(255, 255, 255, 0.55);
}

.secondary-action,
.review-evidence-button {
  color: var(--secondary-color);
  border-color: rgba(138, 164, 255, 0.42);
  background: rgba(138, 164, 255, 0.08);
}

.secondary-action:hover:not(:disabled),
.review-evidence-button:hover:not(:disabled) {
  color: #060913;
  background: var(--secondary-color);
  border-color: rgba(232, 238, 255, 0.85);
  box-shadow: 0 0 1.5rem rgba(138, 164, 255, 0.26);
}

.danger-action,
.reset-button,
.footer-reset-button {
  color: #ffc9d7;
  border-color: rgba(255, 65, 109, 0.46);
  background:
    linear-gradient(180deg, rgba(255, 65, 109, 0.14), rgba(255, 65, 109, 0.05)),
    rgba(15, 4, 9, 0.75);
}

.danger-action:hover:not(:disabled),
.reset-button:hover:not(:disabled),
.footer-reset-button:hover:not(:disabled) {
  color: #fff5f8;
  background: var(--danger-color);
  border-color: rgba(255, 218, 227, 0.85);
  box-shadow: var(--shadow-danger);
}

.briefing-save-note {
  margin: 0;
  color: var(--text-dim);
  font-size: 0.8rem;
  letter-spacing: 0.04em;
}

.command-dashboard {
  padding-block: clamp(1.25rem, 4vw, 3rem);
  transition: opacity 360ms ease, filter 360ms ease;
}

.dashboard-dimmed {
  opacity: 0.62;
  filter: saturate(0.62);
}

.dashboard-active {
  opacity: 1;
  filter: saturate(1);
}

.dashboard-progress-rail {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
  overflow: hidden;
  margin-bottom: clamp(1rem, 3vw, 1.5rem);
}

.progress-node {
  min-width: 0;
  padding: 1rem;
  border-right: 1px solid rgba(104, 255, 225, 0.12);
  border-bottom: 1px solid rgba(104, 255, 225, 0.12);
  background:
    linear-gradient(180deg, rgba(104, 255, 225, 0.045), transparent),
    rgba(3, 8, 13, 0.35);
}

.progress-node:nth-child(2n) {
  border-right: 0;
}

.progress-node:nth-last-child(-n + 2) {
  border-bottom: 0;
}

.progress-number {
  display: block;
  color: var(--primary-color);
  font-family: var(--display-font);
  font-size: clamp(1.45rem, 7vw, 2.6rem);
  font-weight: 950;
  letter-spacing: 0.04em;
  line-height: 1;
  text-shadow: 0 0 1rem rgba(104, 255, 225, 0.34);
}

.progress-label {
  display: block;
  margin-top: 0.35rem;
  color: var(--text-muted);
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: clamp(1rem, 3vw, 1.5rem);
  min-width: 0;
}

.evidence-section,
.oracle-section,
.timeline-section,
.tribunal-section {
  padding: clamp(1rem, 3vw, 1.5rem);
}

.section-heading-row {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: start;
  justify-content: space-between;
  gap: 0.85rem;
  min-width: 0;
  margin-bottom: 1rem;
}

.section-counter,
.lock-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  min-height: 2.25rem;
  max-width: 100%;
  padding: 0.35rem 0.7rem;
  color: var(--primary-color);
  background: rgba(104, 255, 225, 0.07);
  border: 1px solid rgba(104, 255, 225, 0.28);
  border-radius: 999rem;
  font-family: var(--display-font);
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  box-shadow: inset 0 0 1rem rgba(104, 255, 225, 0.055);
}

.evidence-grid,
.question-grid,
.suspect-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0.85rem;
  min-width: 0;
}

.evidence-card,
.suspect-card {
  position: relative;
  min-width: 0;
  padding: 1rem;
  overflow: hidden;
  background:
    radial-gradient(circle at top right, rgba(104, 255, 225, 0.09), transparent 45%),
    rgba(2, 8, 13, 0.72);
  border: 1px solid rgba(104, 255, 225, 0.16);
  border-radius: var(--radius-md);
  box-shadow: inset 0 0 1.5rem rgba(0, 0, 0, 0.22);
  transition:
    transform var(--motion-duration) ease,
    border-color var(--motion-duration) ease,
    box-shadow var(--motion-duration) ease,
    background-color var(--motion-duration) ease;
}

.evidence-card::before,
.suspect-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0.8rem;
  width: 4rem;
  height: 2px;
  background: var(--primary-color);
  box-shadow: 0 0 1rem currentColor;
  opacity: 0.7;
}

.evidence-card:hover,
.suspect-card:hover {
  transform: translateY(-2px);
  border-color: rgba(104, 255, 225, 0.36);
  box-shadow: var(--shadow-glow), inset 0 0 1.5rem rgba(0, 0, 0, 0.22);
}

.evidence-card-collected {
  background:
    radial-gradient(circle at top right, rgba(104, 255, 225, 0.18), transparent 48%),
    linear-gradient(180deg, rgba(104, 255, 225, 0.07), rgba(2, 8, 13, 0.74));
  border-color: rgba(104, 255, 225, 0.48);
}

.evidence-card-collected::after {
  content: "SECURED";
  position: absolute;
  right: 0.75rem;
  bottom: 0.55rem;
  color: rgba(104, 255, 225, 0.11);
  font-family: var(--display-font);
  font-size: 1.7rem;
  font-weight: 950;
  letter-spacing: 0.12em;
  line-height: 1;
}

.evidence-card-topline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.55rem;
  min-width: 0;
  margin-bottom: 0.9rem;
}

.evidence-signal,
.evidence-state,
.question-state {
  color: var(--primary-color);
  font-size: 0.65rem;
  font-weight: 900;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.evidence-state,
.question-state {
  color: var(--text-dim);
}

.evidence-title,
.timeline-title,
.suspect-name,
.ending-title {
  margin: 0;
  color: #f6fffc;
  font-family: var(--display-font);
  font-size: clamp(1.05rem, 3vw, 1.28rem);
  font-weight: 900;
  letter-spacing: 0.025em;
  line-height: 1.18;
}

.evidence-detail-list,
.score-summary {
  display: grid;
  gap: 0.6rem;
  margin: 1rem 0;
  min-width: 0;
}

.evidence-detail-row,
.score-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0.2rem;
  min-width: 0;
  padding-top: 0.6rem;
  border-top: 1px solid rgba(104, 255, 225, 0.1);
}

.evidence-detail-term,
.score-term {
  color: var(--text-dim);
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.evidence-detail-description,
.score-value {
  margin: 0;
  min-width: 0;
  color: #cbe7e5;
}

.evidence-action {
  width: 100%;
  margin-top: 0.25rem;
}

.oracle-terminal {
  position: relative;
  min-width: 0;
  min-height: 14rem;
  padding: 1rem;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(104, 255, 225, 0.06), rgba(104, 255, 225, 0.02)),
    repeating-linear-gradient(0deg, rgba(104, 255, 225, 0.025) 0 1px, transparent 1px 0.45rem),
    #02080b;
  border: 1px solid rgba(104, 255, 225, 0.26);
  border-radius: var(--radius-md);
  box-shadow: inset 0 0 2.2rem rgba(104, 255, 225, 0.06);
}

.oracle-terminal::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.2;
  background: linear-gradient(90deg, transparent 0 6%, rgba(104, 255, 225, 0.16) 7%, transparent 8% 100%);
  animation: terminalSweep 5s linear infinite;
}

.oracle-response {
  position: relative;
  z-index: 1;
  margin: 0;
  color: #d7fff7;
  font-size: clamp(0.95rem, 2.5vw, 1.1rem);
  line-height: 1.75;
  text-shadow: 0 0 0.55rem rgba(104, 255, 225, 0.24);
}

.oracle-status {
  position: relative;
  z-index: 1;
  margin: 1rem 0 0;
  padding-top: 0.8rem;
  color: var(--warning-color);
  border-top: 1px dashed rgba(255, 207, 107, 0.24);
  font-size: 0.82rem;
}

.question-grid {
  margin-top: 0.9rem;
}

.question-button {
  width: 100%;
  justify-content: space-between;
  min-height: 3.4rem;
  text-align: left;
}

.question-button-asked {
  color: #041411;
  background: rgba(104, 255, 225, 0.9);
  border-color: rgba(232, 255, 249, 0.8);
}

.question-button-asked .question-state {
  color: rgba(3, 16, 14, 0.72);
}

.question-prompt {
  min-width: 0;
  overflow-wrap: anywhere;
}

.conflict-meter {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.meter-segment {
  display: block;
  height: 0.72rem;
  min-width: 0;
  background: rgba(104, 255, 225, 0.08);
  border: 1px solid rgba(104, 255, 225, 0.17);
  border-radius: 999rem;
  box-shadow: inset 0 0 1rem rgba(0, 0, 0, 0.28);
  transition:
    background-color var(--motion-duration) ease,
    box-shadow var(--motion-duration) ease,
    border-color var(--motion-duration) ease;
}

.meter-segment-active {
  background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
  border-color: rgba(232, 255, 249, 0.7);
  box-shadow: 0 0 1.1rem rgba(104, 255, 225, 0.24);
}

.timeline-list {
  position: relative;
  display: grid;
  gap: 0.9rem;
  margin: 0;
  padding: 0;
  list-style: none;
  min-width: 0;
}

.timeline-list::before {
  content: "";
  position: absolute;
  top: 0.5rem;
  bottom: 0.5rem;
  left: 0.45rem;
  width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(104, 255, 225, 0.34), transparent);
}

.timeline-event {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0.75rem;
  min-width: 0;
  padding: 0.9rem 0.9rem 0.9rem 1.45rem;
  background: rgba(3, 8, 13, 0.58);
  border: 1px solid rgba(104, 255, 225, 0.13);
  border-radius: var(--radius-md);
  transition:
    transform var(--motion-duration) ease,
    border-color var(--motion-duration) ease,
    background-color var(--motion-duration) ease,
    box-shadow var(--motion-duration) ease;
}

.timeline-event::before {
  content: "";
  position: absolute;
  top: 1.2rem;
  left: 0.18rem;
  width: 0.55rem;
  aspect-ratio: 1;
  background: var(--background-color);
  border: 1px solid var(--primary-color);
  border-radius: 50%;
  box-shadow: 0 0 0.9rem rgba(104, 255, 225, 0.34);
}

.timeline-event:hover {
  transform: translateX(2px);
  border-color: rgba(104, 255, 225, 0.32);
}

.timeline-event-marked {
  background:
    linear-gradient(90deg, rgba(255, 95, 158, 0.12), transparent 55%),
    rgba(3, 8, 13, 0.68);
  border-color: rgba(255, 95, 158, 0.42);
  box-shadow: 0 0 1.5rem rgba(255, 95, 158, 0.08);
}

.timeline-event-marked::before {
  border-color: var(--accent-color);
  background: var(--accent-color);
  box-shadow: 0 0 1rem rgba(255, 95, 158, 0.38);
}

.timeline-timeblock {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.45rem 0.75rem;
  min-width: 0;
}

.timeline-time {
  color: var(--primary-color);
  font-family: var(--display-font);
  font-size: 1.1rem;
  font-weight: 950;
  letter-spacing: 0.08em;
}

.timeline-source {
  color: var(--text-dim);
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.timeline-statement,
.timeline-conflict,
.suspect-motive,
.suspect-hint,
.ending-epilogue,
.ending-outcome,
.tribunal-help,
.lock-message {
  margin: 0.65rem 0 0;
  color: #c2dddd;
}

.timeline-conflict {
  color: #ffd5e0;
}

.timeline-conflict-label,
.suspect-label {
  color: var(--accent-color);
  font-weight: 900;
  text-transform: uppercase;
}

.timeline-action {
  margin-top: 0.85rem;
}

.lock-badge {
  color: var(--warning-color);
  border-color: rgba(255, 207, 107, 0.35);
  background: rgba(255, 207, 107, 0.08);
}

.lock-badge-open {
  color: var(--primary-color);
  border-color: rgba(104, 255, 225, 0.42);
  background: rgba(104, 255, 225, 0.1);
}

.lock-panel {
  margin-bottom: 1rem;
  padding: 1rem;
  background:
    linear-gradient(90deg, rgba(255, 207, 107, 0.08), transparent),
    rgba(5, 9, 14, 0.65);
  border: 1px solid rgba(255, 207, 107, 0.22);
  border-radius: var(--radius-md);
}

.lock-message {
  margin-top: 0;
  color: #ffe9b7;
}

.lock-check-complete {
  color: var(--primary-color);
}

.lock-check-complete::before {
  content: "◆";
}

.lock-check-pending {
  color: var(--text-muted);
}

.lock-check-pending::before {
  content: "◇";
  color: var(--warning-color);
}

.suspect-card-accused {
  border-color: rgba(255, 95, 158, 0.56);
  background:
    radial-gradient(circle at top right, rgba(255, 95, 158, 0.18), transparent 48%),
    rgba(11, 5, 12, 0.72);
  box-shadow: var(--shadow-danger);
}

.suspect-role {
  margin: 0.25rem 0 0;
  color: var(--text-dim);
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.accusation-button {
  width: 100%;
  margin-top: 0.9rem;
}

.tribunal-help {
  color: var(--text-dim);
  font-size: 0.82rem;
}

.ending-panel {
  position: relative;
  margin-top: 1.2rem;
  padding: clamp(1rem, 3vw, 1.5rem);
  overflow: hidden;
  background:
    linear-gradient(135deg, rgba(104, 255, 225, 0.12), transparent 42%),
    rgba(2, 8, 13, 0.78);
  border: 1px solid rgba(104, 255, 225, 0.34);
  border-radius: var(--radius-lg);
  box-shadow: 0 0 2rem rgba(104, 255, 225, 0.12);
}

.ending-panel::before {
  content: "";
  position: absolute;
  inset: auto -10% -35% auto;
  width: 20rem;
  aspect-ratio: 1;
  pointer-events: none;
  opacity: 0.18;
  background: repeating-conic-gradient(from 0deg, currentColor 0 5deg, transparent 5deg 18deg);
  border-radius: 50%;
}

.ending-oracle {
  color: var(--primary-color);
  border-color: rgba(104, 255, 225, 0.58);
}

.ending-voss {
  color: var(--accent-color);
  border-color: rgba(255, 95, 158, 0.54);
  background:
    linear-gradient(135deg, rgba(255, 95, 158, 0.13), transparent 45%),
    rgba(14, 4, 12, 0.78);
}

.ending-crowe {
  color: var(--warning-color);
  border-color: rgba(255, 207, 107, 0.5);
  background:
    linear-gradient(135deg, rgba(255, 207, 107, 0.12), transparent 45%),
    rgba(13, 9, 3, 0.78);
}

.ending-title {
  font-size: clamp(1.35rem, 4vw, 2rem);
}

.ending-outcome {
  color: #f1fffb;
  font-weight: 800;
}

.score-summary {
  margin-top: 1.2rem;
  border-top: 1px solid rgba(104, 255, 225, 0.14);
}

.score-row {
  grid-template-columns: minmax(0, 1fr) minmax(0, auto);
  align-items: baseline;
}

.score-value {
  color: var(--text-color);
  font-weight: 900;
  text-align: right;
}

.ending-actions,
.footer-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  min-width: 0;
  margin-top: 1rem;
}

.site-footer,
.ghost-footer {
  position: relative;
  margin-top: clamp(1rem, 4vw, 3rem);
  border-top: 1px solid rgba(104, 255, 225, 0.18);
  background:
    radial-gradient(circle at 20% 0%, rgba(104, 255, 225, 0.1), transparent 24rem),
    linear-gradient(180deg, rgba(4, 10, 16, 0.9), #020408);
}

.footer-content,
.ghost-footer-content {
  width: min(100%, var(--max-content));
  margin-inline: auto;
  padding: clamp(1.25rem, 4vw, 2.5rem);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 1rem;
  min-width: 0;
}

.footer-tagline,
.footer-copyright {
  margin: 0.7rem 0 0;
  color: var(--text-dim);
  font-size: 0.82rem;
}

.footer-status-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  min-width: 0;
}

.footer-status-item {
  display: inline-flex;
  align-items: center;
  min-height: 2.25rem;
  max-width: 100%;
  padding: 0.35rem 0.65rem;
  color: var(--text-muted);
  background: rgba(104, 255, 225, 0.055);
  border: 1px solid rgba(104, 255, 225, 0.13);
  border-radius: 999rem;
  font-size: 0.7rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.footer-links,
.ghost-footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
  min-width: 0;
}

.footer-copyright {
  padding-top: 1rem;
  border-top: 1px solid rgba(104, 255, 225, 0.1);
}

:focus-visible {
  outline: 2px solid var(--primary-color);
  outline-offset: 3px;
  box-shadow: 0 0 0 0.25rem rgba(104, 255, 225, 0.14);
}

@media (min-width: 34rem) {
  .station-status-grid,
  .dashboard-progress-rail {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .progress-node,
  .progress-node:nth-child(2n),
  .progress-node:nth-last-child(-n + 2) {
    border-right: 1px solid rgba(104, 255, 225, 0.12);
    border-bottom: 0;
  }

  .progress-node:last-child {
    border-right: 0;
  }

  .evidence-detail-row {
    grid-template-columns: minmax(7.5rem, 0.44fr) minmax(0, 1fr);
  }

  .timeline-event {
    grid-template-columns: minmax(5.75rem, 0.22fr) minmax(0, 1fr);
  }

  .timeline-list::before {

                  <li className="control-item">Collect all three major clues from the station map.</li>
                  <li className="control-item">Ask ORACLE-9 at least two questions and read its contradictions.</li>
                  <li className="control-item">Mark three suspicious timeline conflicts.</li>
                  <li className="control-item">Accuse one suspect and unlock an ending.</li>
                </ul>
              </div>
  
              <div className="briefing-actions">
                <button type="button" className="sg-btn primary-action mission-start-button" onClick={dismissBriefing}>
                  {save.briefingDismissed ? "Continue Investigation" : "Start Investigation"}
                </button>
                <p className="briefing-save-note" aria-live="polite">
                  {savedLabel}
                </p>
              </div>
            </div>
          </section>
  
          <section
            id="investigation-dashboard"
            className={`command-dashboard${save.briefingDismissed ? " dashboard-active" : " dashboard-dimmed"}`}
            aria-label="Investigation dashboard"
          >
            <div className="dashboard-progress-rail sg-card" aria-label="Investigation progress">
              <div className="progress-node">
                <span className="progress-number">{clueProgressText}</span>
                <span className="progress-label">Clues secured</span>
              </div>
              <div className="progress-node">
                <span className="progress-number">{questionProgressText}</span>
                <span className="progress-label">Questions asked</span>
              </div>
              <div className="progress-node">
                <span className="progress-number">{timelineProgressText}</span>
                <span className="progress-label">Conflicts found</span>
              </div>
              <div className="progress-node">
                <span className="progress-number">{score}</span>
                <span className="progress-label">Integrity score</span>
              </div>
            </div>
  
            <div className="dashboard-grid">
              <section id="evidence-board" className="evidence-section sg-card" aria-labelledby="evidence-title">
                <div className="section-heading-row">
                  <div className="section-heading-copy">
                    <p className="section-kicker">A / Evidence Acquisition</p>
                    <h2 id="evidence-title" className="section-title">
                      Station Map: Recover exactly three major clues.
                    </h2>
                  </div>
                  <span className="section-counter" aria-label={`${save.collectedClues.length} of ${clues.length} clues collected`}>
                    {clueProgressText}
                  </span>
                </div>
  
                <div className="evidence-grid">
                  {clues.map((clue) => {
                    const collected = save.collectedClues.includes(clue.id);
  
                    return (
                      <article key={clue.id} className={`evidence-card${collected ? " evidence-card-collected" : ""}`}>
                        <div className="evidence-card-topline">
                          <span className="evidence-signal">{clue.signal}</span>
                          <span className="evidence-state">{collected ? "Collected" : "Uncollected"}</span>
                        </div>
                        <h3 className="evidence-title">{clue.title}</h3>
                        <dl className="evidence-detail-list">
                          <div className="evidence-detail-row">
                            <dt className="evidence-detail-term">Location</dt>
                            <dd className="evidence-detail-description">{clue.location}</dd>
                          </div>
                          <div className="evidence-detail-row">
                            <dt className="evidence-detail-term">Timestamp</dt>
                            <dd className="evidence-detail-description">{clue.timestamp}</dd>
                          </div>
                          <div className="evidence-detail-row">
                            <dt className="evidence-detail-term">Physical detail</dt>
                            <dd className="evidence-detail-description">{clue.physicalDetail}</dd>
                          </div>
                          <div className="evidence-detail-row">
                            <dt className="evidence-detail-term">Implication</dt>
                            <dd className="evidence-detail-description">{clue.implication}</dd>
                          </div>
                        </dl>
                        <button
                          type="button"
                          className="sg-btn evidence-action"
                          onClick={() => collectClue(clue.id)}
                          disabled={collected}
                          aria-pressed={collected}
                        >
                          {collected ? "Evidence secured" : clue.actionLabel}
                        </button>
                      </article>
                    );
                  })}
                </div>
              </section>
  
              <section className="oracle-section sg-card" aria-labelledby="oracle-title">
                <div className="section-heading-row">
                  <div className="section-heading-copy">
                    <p className="section-kicker">B / AI Witness Interrogation</p>
                    <h2 id="oracle-title" className="section-title">
                      ORACLE-9 Console
                    </h2>
                  </div>
                  <span className="section-counter">{questionProgressText}</span>
                </div>
  
                <div className="oracle-terminal" aria-live="polite" aria-atomic="true">
                  <p className="oracle-speaker">ORACLE-9</p>
                  <p className="oracle-response">
                    {activeQuestion ? activeQuestion.response : "Ask a question. I remember everything. I remember nothing. Both statements are compliant."}
                  </p>
                  <p className="oracle-status">{oracleStatus}</p>
                </div>
  
                <div className="question-grid" role="group" aria-label="Questions for ORACLE-9">
                  {oracleQuestions.map((question) => {
                    const asked = save.askedQuestions.includes(question.id);
  
                    return (
                      <button
                        key={question.id}
                        type="button"
                        className={`question-button sg-btn${asked ? " question-button-asked" : ""}`}
                        onClick={() => askQuestion(question.id)}
                        aria-pressed={asked}
                      >
                        <span className="question-prompt">{question.prompt}</span>
                        <span className="question-state">{asked ? "Asked" : "Ask"}</span>
                      </button>
                    );
                  })}
                </div>
              </section>
  
              <section className="timeline-section sg-card" aria-labelledby="timeline-title">
                <div className="section-heading-row">
                  <div className="section-heading-copy">
                    <p className="section-kicker">C / Conflict Timeline</p>
                    <h2 id="timeline-title" className="section-title">
                      Mark suspicious contradictions.
                    </h2>
                  </div>
                  <span className="section-counter">{timelineProgressText}</span>
                </div>
  
                <div className="conflict-meter" aria-label={`${contradictionsFound} of 3 required contradictions found`}>
                  <span className={`meter-segment${contradictionsFound >= 1 ? " meter-segment-active" : ""}`}></span>
                  <span className={`meter-segment${contradictionsFound >= 2 ? " meter-segment-active" : ""}`}></span>
                  <span className={`meter-segment${contradictionsFound >= 3 ? " meter-segment-active" : ""}`}></span>
                </div>
  
                <ol className="timeline-list">
                  {timelineEvents.map((event) => {
                    const marked = save.markedTimelineEvents.includes(event.id);
  
                    return (
                      <li key={event.id} className={`timeline-event${marked ? " timeline-event-marked" : ""}`}>
                        <div className="timeline-timeblock">
                          <span className="timeline-time">{event.time}</span>
                          <span className="timeline-source">{event.source}</span>
                        </div>
                        <div className="timeline-content">
                          <h3 className="timeline-title">{event.title}</h3>
                          <p className="timeline-statement">{event.statement}</p>
                          <p className="timeline-conflict">
                            <span className="timeline-conflict-label">Conflict:</span> {event.conflictWith}
                          </p>
                          <button
                            type="button"
                            className="sg-btn timeline-action"
                            onClick={() => toggleTimelineFlag(event.id)}
                            aria-pressed={marked}
                          >
                            {marked ? "Unmark conflict" : "Mark suspicious"}
                          </button>
                        </div>
                      </li>
                    );
                  })}
                </ol>
              </section>
  
              <section id="final-tribunal" className="tribunal-section sg-card" aria-labelledby="tribunal-title">
                <div className="section-heading-row">
                  <div className="section-heading-copy">
                    <p className="section-kicker">D / Final Accusation</p>
                    <h2 id="tribunal-title" className="section-title">
                      Accuse the architect of the haunting.
                    </h2>
                  </div>
                  <span className={`lock-badge${accusationUnlocked ? " lock-badge-open" : ""}`}>
                    {accusationUnlocked ? "Unlocked" : "Locked"}
                  </span>
                </div>
  
                {!accusationUnlocked && (
                  <div className="lock-panel" role="status">
                    <p className="lock-message">
                      Accusation locked. Required: collect all three clues, ask at least two ORACLE-9 questions,
                      and mark three timeline contradictions.
                    </p>
                    <ul className="lock-checklist">
                      <li className={allCluesCollected ? "lock-check-complete" : "lock-check-pending"}>
                        Evidence collected: {clueProgressText}
                      </li>
                      <li className={interrogationComplete ? "lock-check-complete" : "lock-check-pending"}>
                        Interrogation threshold: {save.askedQuestions.length}/2
                      </li>
                      <li className={timelineComplete ? "lock-check-complete" : "lock-check-pending"}>
                        Contradictions found: {timelineProgressText}
                      </li>
                    </ul>
                  </div>
                )}
  
                <div className="suspect-grid">
                  {suspects.map((suspect) => {
                    const accused = save.finalAccusation === suspect.id;
  
                    return (
                      <article key={suspect.id} className={`suspect-card${accused ? " suspect-card-accused" : ""}`}>
                        <div className="suspect-heading">
                          <h3 className="suspect-name">{suspect.name}</h3>
                          <p className="suspect-role">{suspect.role}</p>
                        </div>
                        <p className="suspect-motive">
                          <span className="suspect-label">Motive:</span> {suspect.motive}
                        </p>
                        <p className="suspect-hint">
                          <span className="suspect-label">Reasoning hint:</span> {suspect.hint}
                        </p>
                        <button
                          type="button"
                          className="sg-btn accusation-button"
                          onClick={() => makeAccusation(suspect.id)}
                          disabled={!accusationUnlocked || Boolean(save.endingId)}
                          aria-describedby={!accusationUnlocked ? "accusation-lock-help" : undefined}
                        >
                          {accused ? "Accused" : `Accuse ${suspect.name}`}
                        </button>
                      </article>
                    );
                  })}
                </div>
  
                <p id="accusation-lock-help" className="tribunal-help">
                  {accusationUnlocked
                    ? "Choose carefully. Your accusation determines the ending."
                    : "Disabled accusation buttons unlock after evidence, interrogation, and timeline requirements are complete."}
                </p>
  
                {currentEnding && (
                  <section className={`ending-panel ending-${currentEnding.id}`} aria-labelledby="ending-title">
                    <p className="ending-kicker">Case Verdict</p>
                    <h3 id="ending-title" className="ending-title">
                      {currentEnding.verdict}
                    </h3>
                    <p className="ending-epilogue">{currentEnding.epilogue}</p>
                    <p className="ending-outcome">{currentEnding.outcome}</p>
  
                    <dl className="score-summary">
                      <div className="score-row">
                        <dt className="score-term">Evidence</dt>
                        <dd className="score-value">{clueProgressText}</dd>
                      </div>
                      <div className="score-row">
                        <dt className="score-term">Contradictions</dt>
                        <dd className="score-value">{timelineProgressText}</dd>
                      </div>
                      <div className="score-row">
                        <dt className="score-term">Questions</dt>
                        <dd className="score-value">{questionProgressText}</dd>
                      </div>
                      <div className="score-row">
                        <dt className="score-term">Rating</dt>
                        <dd className="score-value">{currentEnding.rating}</dd>
                      </div>
                      <div className="score-row">
                        <dt className="score-term">Integrity Score</dt>
                        <dd className="score-value">{score}/100</dd>
                      </div>
                    </dl>
  
                    <div className="ending-actions">
                      <button type="button" className="sg-btn secondary-action review-evidence-button" onClick={reviewEvidence}>
                        Review Evidence
                      </button>
                      <button type="button" className="sg-btn danger-action reset-button" onClick={resetInvestigation}>
                        {resetArmed ? "Confirm Reset Investigation" : "Reset Investigation"}
                      </button>
                    </div>
                  </section>
                )}
              </section>
            </div>
          </section>
        </main>
  
        <footer className="site-footer ghost-footer" role="contentinfo" aria-label="Site footer">
          <div className="footer-content ghost-footer-content">
            <div className="footer-brand-block">
              <a href="/" className="footer-brand">
                <span className="footer-logo" aria-hidden="true">
                  ◈
                </span>
                <span className="footer-branding">Ghost Protocol</span>
              </a>
              <p className="footer-tagline">
                Station K-17 incident board. Progress is stored locally in this browser only.
              </p>
            </div>
  
            <div className="footer-status-bar" aria-label="Current investigation summary">
              <span className="footer-status-item">Clues {clueProgressText}</span>
              <span className="footer-status-item">Questions {questionProgressText}</span>
              <span className="footer-status-item">Conflicts {timelineProgressText}</span>
              <span className="footer-status-item">{savedLabel}</span>
            </div>
  
            <div className="footer-links ghost-footer-links">
              {footerLinks.map((link) => (
                <a key={link.href} href={link.href} className="footer-link ghost-footer-link">
                  {link.label}
                </a>
              ))}
            </div>
  
            <div className="footer-actions">
              <button type="button" className="sg-btn danger-action footer-reset-button" onClick={resetInvestigation}>
                {resetArmed ? "Confirm Reset Investigation" : "Reset Investigation"}
              </button>
            </div>
  
            <p className="footer-copyright">
              © 2024 Ghost Protocol. No external network calls. No remote assets. Local investigation only.
            </p>
          </div>
        </footer>
      </div>
    );
  }
